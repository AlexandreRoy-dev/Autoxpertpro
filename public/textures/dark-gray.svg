<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#323232"/>
      <stop offset="0.45" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.22  0 0 0 0 0.225  0 0 0 0.55 0"/>
    </filter>
    <filter id="speckle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.95" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="wash" cx="72%" cy="18%" r="78%">
      <stop offset="0" stop-color="#3a3a3a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#222222" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#base)"/>
  <rect width="512" height="512" fill="url(#wash)"/>
  <rect width="512" height="512" filter="url(#grain)"/>
  <rect width="512" height="512" filter="url(#speckle)" opacity="0.1" style="mix-blend-mode:overlay"/>
</svg>
